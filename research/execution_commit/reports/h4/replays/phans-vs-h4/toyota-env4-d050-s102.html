<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAPF-HD — сравнение планов</title>
<style>
  :root { color-scheme:light; font-family:"Segoe UI",Tahoma,sans-serif; color:#17394a; background:#eef3f6; }
  * { box-sizing:border-box; }
  body { margin:0; }
  main { max-width:1800px; margin:auto; padding:22px 24px; }
  header { margin-bottom:17px; }
  h1 { font-size:24px; font-weight:650; letter-spacing:-.5px; margin:0 0 5px; }
  #metadata { font-size:14px; color:#526d7b; overflow-wrap:anywhere; margin:0; }
  .viewer { border:1px solid #c9d7de; background:white; border-radius:8px; overflow:hidden; }
  .toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:10px 20px; padding:12px 16px; border-bottom:1px solid #dce5e9; font-size:14px; }
  .toolbar label { display:flex; align-items:center; gap:7px; }
  button,select { font:inherit; color:inherit; background:white; border:1px solid #bdcdd5; border-radius:5px; min-height:36px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#edf5f7; }
  button:disabled { opacity:.4; cursor:default; }
  button:focus-visible,select:focus-visible,input:focus-visible { outline:3px solid #d58716; outline-offset:3px; }
  input[type=checkbox] { accent-color:#08687a; width:16px; height:16px; }
  .panels { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:#c9d7de; }
  .panel { min-width:0; background:white; }
  .heading { display:flex; flex-wrap:wrap; align-items:baseline; gap:5px 14px; padding:14px 16px 8px; }
  h2 { font-size:20px; font-weight:650; margin:0; overflow-wrap:anywhere; }
  .role { font-size:12px; color:#526d7b; }
  .status { margin:0; min-height:27px; padding:0 16px 9px; color:#526d7b; font-size:13px; overflow-wrap:anywhere; }
  .status.solved { color:#08604b; }
  .stats { display:flex; flex-wrap:wrap; padding:0 16px 12px; font-size:13px; font-variant-numeric:tabular-nums; }
  .map { height:clamp(250px,55vh,700px); overflow:auto; background:#e7eef2; }
  canvas { display:block; margin:auto; touch-action:pan-x pan-y; }
  .inspect { font-size:12px; color:#526d7b; margin:0; padding:8px 16px; min-height:34px; font-variant-numeric:tabular-nums; }
  .transport { display:flex; align-items:center; gap:8px; padding:14px 16px 8px; border-top:1px solid #dce5e9; }
  #play { background:#08687a; color:white; border-color:#08687a; min-width:86px; font-weight:600; }
  #play:hover { background:#055b6b; }
  #tick { margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:14px; }
  .scrubber { display:flex; align-items:center; gap:14px; padding:0 18px 12px; font-size:12px; color:#526d7b; }
  #timeline { width:100%; accent-color:#08687a; cursor:pointer; min-height:28px; margin:0; }
  .legend { display:flex; flex-wrap:wrap; gap:9px 20px; padding:12px 16px; border-top:1px solid #dce5e9; font-size:13px; }
  .legend span { display:inline-flex; align-items:center; gap:7px; }
  .symbol { width:13px; height:13px; display:inline-block; flex-shrink:0; }
  .target { border-radius:50%; background:#c54c39; }
  .goal { border:2px solid #c54c39; }
  .blocker { background:#8295a0; border-radius:2px; }
  .wall { background:#294653; }
  #targets { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
  .agent { display:flex; align-items:center; gap:7px; font-size:13px; min-height:32px; padding:5px 10px; }
  .agent[aria-pressed=true] { background:#e3eef2; border-color:#466879; }
  .swatch { width:11px; height:11px; border-radius:50%; }
  @media(max-width:760px) { main { padding:15px 10px; } h1 { font-size:22px; } .heading { padding:10px 8px 6px; } h2 { font-size:17px; } .status,.stats { padding-left:8px; padding-right:8px; } .map { height:clamp(220px,43vh,420px); } .toolbar { padding:10px; gap:10px 14px; } .transport { padding:12px 10px 8px; gap:5px; } .transport button { padding:6px 9px; } #tick { font-size:12px; } }
</style>

<main>
  <header><h1>Сравнение планов MAPF-HD</h1><p id="metadata"></p></header>
  <section class="viewer" aria-label="Синхронное сравнение планов">

        <div class="stats"><span id="baseline-tick"></span></div>

        <p id="baseline-inspect" class="inspect"></p>

      <section class="panel" aria-labelledby="candidate-name">

        <div class="stats"><span id="candidate-tick"></span></div>
        <div id="candidate-view" class="map"><canvas id="candidate-canvas" role="img"></canvas></div>
        <p id="candidate-inspect" class="inspect"></p>
      </section>
    </div>
    <div class="transport">
      <button id="back" type="button" aria-label="Предыдущий такт" title="Предыдущий такт (стрелка влево)">‹ Шаг</button>

      <button id="forward" type="button" aria-label="Следующий такт" title="Следующий такт (стрелка вправо)">Шаг ›</button>
      <output id="tick" for="timeline"></output>
    </div>
    <div class="scrubber"><span>0</span><input id="timeline" aria-label="Общий такт" type="range" min="0" max="0" value="0" step="1"><span id="last-tick"></span></div>
    <div class="legend">
      <span><i class="symbol target"></i>Целевой агент</span><span><i class="symbol goal"></i>Его цель</span>
      <span><i class="symbol blocker"></i>Блокирующий агент</span><span><i class="symbol wall"></i>Стена</span>
    </div>
  </section>

  function drawSide(side) {
    const {context, backdrop, canvas, key} = side, frame = frameAt(side);
    const scale = Math.min(window.devicePixelRatio || 1, 2), currentTick = Math.min(tick, side.plan.last_tick);
    context.setTransform(1, 0, 0, 1, 0, 0); context.drawImage(backdrop, 0, 0); context.setTransform(scale, 0, 0, scale, 0, 0);
    frame.forEach(([x,y], i) => {
      const cx = margin + (x + .5) * cell, cy = margin + (y + .5) * cell;
      context.fillStyle = i < grid.goals.length ? color(i) : "#8295a0";
      if (i < grid.goals.length) { context.beginPath(); context.arc(cx, cy, cell * .34, 0, Math.PI * 2); context.fill(); }
      else context.fillRect(cx - cell * .24, cy - cell * .24, cell * .48, cell * .48);
      if ($("show-ids").checked && cell >= 12) {
        context.font = `${Math.max(7, Math.min(13, cell * .30))}px "Segoe UI",sans-serif`;
        context.textAlign = "center"; context.textBaseline = "middle"; context.fillStyle = i < grid.goals.length ? "white" : "#132f3d";
        context.fillText(i, cx, cy, cell * .65);
      }
    });
    grid.goals.forEach(([x,y], i) => {
      context.strokeStyle = color(i); context.lineWidth = Math.max(1.2, cell * .07);
      context.strokeRect(margin + (x + .09) * cell, margin + (y + .09) * cell, cell * .82, cell * .82);
    });
    if (selected !== null) {
      const [x,y] = frame[selected]; context.strokeStyle = "#17394a"; context.lineWidth = 2;
      context.beginPath(); context.arc(margin + (x + .5) * cell, margin + (y + .5) * cell, cell * .47, 0, Math.PI * 2); context.stroke();
    }
    $(`${key}-tick`).textContent = `Такт: ${currentTick} / ${side.plan.last_tick}`;
    $(`${key}-tick`).title = tick > side.plan.last_tick ? "Показано последнее сохранённое состояние" : "";
    canvas.setAttribute("aria-label", side.plan.trace_available === false
      ? `${side.plan.solver}: начальное состояние, трасса отсутствует`
      : `${side.plan.solver}: карта на такте ${currentTick}`);
    let inspected = "";
    if (side.hover) {
      const [x,y] = side.hover, agent = frame.findIndex(p => p[0] === x && p[1] === y), goal = grid.goals.findIndex(p => p[0] === x && p[1] === y);
      inspected = `(${x}, ${y})${agent >= 0 ? ` / Агент ${agent}` : ""}${goal >= 0 ? ` / Цель ${goal}` : ""}`;
    } else if (selected !== null) inspected = `Агент ${selected}: (${frame[selected].join(", ")}) / Цель: (${grid.goals[selected].join(", ")})`;
    $(`${key}-inspect`).textContent = inspected;
  }

  function draw() {
    sides.forEach(drawSide);
    $("tick").textContent = `Такт: ${tick} / ${maxTick}`;
    $("timeline").value = tick;
    $("back").disabled = tick === 0; $("forward").disabled = tick === maxTick; $("play").disabled = maxTick === 0;
    targetButtons.forEach((button, i) => button.setAttribute("aria-pressed", String(selected === i)));
  }

  function pause() {
    if (animation !== null) cancelAnimationFrame(animation);
    animation = null; playing = false; previousTime = null; accumulated = 0;
    $("play").textContent = "Пуск"; $("play").setAttribute("aria-pressed", "false");
  }
  function seek(value) { pause(); tick = Math.max(0, Math.min(maxTick, Number(value))); draw(); }
  function toggle() {
    if (playing) { pause(); return; }
    if (maxTick === 0) return;
    if (tick === maxTick) tick = 0;
    playing = true; previousTime = null; accumulated = 0;
    $("play").textContent = "Пауза"; $("play").setAttribute("aria-pressed", "true"); draw(); animation = requestAnimationFrame(animate);
  }
  function animate(time) {
    animation = null;
    if (!playing) return;
    if (previousTime !== null) accumulated += Math.min(time - previousTime, 1000);
    previousTime = time;
    const interval = 1000 / Number($("speed").value);
    if (accumulated >= interval) {
      const steps = Math.floor(accumulated / interval); accumulated %= interval;
      tick = Math.min(maxTick, tick + steps); draw();
      if (tick === maxTick) { pause(); return; }
    }
    animation = requestAnimationFrame(animate);
  }

  grid.goals.forEach((goal, i) => {
    const button = document.createElement("button"), swatch = document.createElement("i"), name = document.createElement("span");
    button.type = "button"; button.className = "agent"; button.setAttribute("aria-pressed", "false");
    swatch.className = "swatch"; swatch.style.background = color(i); name.textContent = `Агент ${i}`;
    button.append(swatch, name);
    button.addEventListener("click", () => {
      selected = selected === i ? null : i;
      if (selected !== null) sides.forEach(side => {
        const [x,y] = frameAt(side)[selected];
        side.view.scrollTo({left:margin + (x + .5) * cell - side.view.clientWidth / 2, top:margin + (y + .5) * cell - side.view.clientHeight / 2});
      });
      draw();
    });
    $("targets").append(button); targetButtons.push(button);
  });
  sides.forEach(side => {
    side.canvas.addEventListener("mousemove", event => {
      const rect = side.canvas.getBoundingClientRect();
      const x = Math.floor((event.clientX - rect.left - margin) / cell), y = Math.floor((event.clientY - rect.top - margin) / cell);
      side.hover = x >= 0 && y >= 0 && x < grid.width && y < grid.height ? [x,y] : null;
      drawSide(side);
    });
    side.canvas.addEventListener("mouseleave", () => { side.hover = null; drawSide(side); });
  });
  $("play").addEventListener("click", toggle);
  $("back").addEventListener("click", () => seek(tick - 1));
  $("forward").addEventListener("click", () => seek(tick + 1));
  $("timeline").addEventListener("input", event => seek(event.target.value));
  $("show-ids").addEventListener("change", draw);
  $("speed").addEventListener("change", () => { accumulated = 0; previousTime = null; });
  document.addEventListener("keydown", event => {
    if (["INPUT", "SELECT", "BUTTON", "TEXTAREA"].includes(event.target.tagName) || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.code === "Space") { event.preventDefault(); toggle(); }
    else if (event.key === "ArrowLeft") { event.preventDefault(); seek(tick - 1); }
    else if (event.key === "ArrowRight") { event.preventDefault(); seek(tick + 1); }
    else if (event.key === "Home") { event.preventDefault(); seek(0); }
    else if (event.key === "End") { event.preventDefault(); seek(maxTick); }
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  window.addEventListener("resize", layout);
  pause();
  layout();
})();
</script>
</body>
</html>
